<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Chat</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0b0b0f">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="eyes-on-chat">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0b0b0f;
  --surface: #14141a;
  --surface2: #1c1c26;
  --border: #2a2a36;
  --text: #e8e8ee;
  --text2: #8888a0;
  --accent: #6c5ce7;
  --accent-glow: rgba(108, 92, 231, 0.3);
  --success: #00e676;
  --incoming: #1c1c26;
  --outgoing: #6c5ce7;
  --radius: 16px;
  --radius-sm: 10px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ===== HEADER ===== */
.chat-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}
.chat-header .avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #a78bfa);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  flex-shrink: 0;
}
.chat-header .info { flex: 1; min-width: 0; }
.chat-header .info .name {
  font-size: 0.95rem;
  font-weight: 600;
}
.chat-header .info .status {
  font-size: 0.7rem;
  color: var(--text2);
  display: flex;
  align-items: center;
  gap: 4px;
}
.chat-header .info .status .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--success);
}
.chat-header .info .status .dot.offline { background: var(--text2); }
.chat-header .back-btn {
  font-size: 1.3rem;
  cursor: pointer;
  padding: 12px;
  margin: -12px;
  color: var(--text2);
  display: flex;
  align-items: center;
}

/* ===== HANDOFF BANNER ===== */
.handoff-banner {
  background: rgba(108, 92, 231, 0.12);
  border: 1px solid rgba(108, 92, 231, 0.25);
  border-radius: var(--radius-sm);
  margin: 8px 16px;
  padding: 10px 14px;
  font-size: 0.78rem;
  color: var(--text2);
  text-align: center;
  display: none;
  animation: slideDown 0.3s ease;
}
.handoff-banner .from { color: var(--text); }
.handoff-banner .to { color: var(--accent); font-weight: 600; }
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== MESSAGES ===== */
.messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.message {
  max-width: 82%;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 1.02rem;
  line-height: 1.45;
  word-wrap: break-word;
  position: relative;
  animation: fadeIn 0.2s ease;
}
.message.incoming {
  align-self: flex-start;
  background: var(--incoming);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
}
.message.outgoing {
  align-self: flex-end;
  background: var(--outgoing);
  color: white;
  border-bottom-right-radius: 4px;
}
.message.system {
  align-self: center;
  background: transparent;
  color: var(--text2);
  font-size: 0.75rem;
  max-width: 90%;
  text-align: center;
  padding: 8px;
}
.message .sender-label {
  font-size: 0.65rem;
  font-weight: 600;
  margin-bottom: 2px;
  opacity: 0.7;
}
.message.incoming .sender-label { color: var(--accent); }
.message ul, .message ol { margin: 4px 0; padding-left: 20px; }
.message li { margin: 2px 0; }
.message strong { font-weight: 700; }
.message a { color: inherit; text-decoration: underline; }
.message.incoming a { color: var(--accent); }
.message code {
  background: rgba(127,127,127,0.18);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 0.85em;
  font-family: 'SF Mono', Consolas, monospace;
}

/* ===== CONFIRMATION BUTTONS ===== */
.message.confirmation {
  align-self: flex-start;
  background: var(--incoming);
  border: 1px solid var(--accent);
  border-bottom-left-radius: 4px;
}
.confirm-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
.confirm-btn {
  flex: 1;
  min-height: 48px;
  padding: 12px 0;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}
.confirm-btn.yes { background: var(--accent); border-color: var(--accent); color: white; }
.confirm-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.confirm-answered {
  margin-top: 8px;
  font-size: 0.75rem;
  color: var(--text2);
  font-style: italic;
}
.message .time {
  font-size: 0.6rem;
  margin-top: 4px;
  opacity: 0.5;
  text-align: right;
}
.message.outgoing .time { color: rgba(255,255,255,0.7); }
.message.incoming .time { color: var(--text2); }

/* Agent change indicator inside message flow */
.agent-change {
  align-self: center;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text2);
  font-size: 0.7rem;
  padding: 4px 0;
  opacity: 0.7;
}
.agent-change .line { width: 30px; height: 1px; background: var(--border); }

/* ===== TYPING INDICATOR ===== */
.typing-indicator {
  align-self: flex-start;
  display: none;
  align-items: center;
  gap: 4px;
  padding: 10px 14px;
  background: var(--incoming);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  border-bottom-left-radius: 4px;
  font-size: 0.78rem;
  color: var(--text2);
}
.typing-indicator .dots { display: flex; gap: 3px; }
.typing-indicator .dots span {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--text2);
  animation: bounce 1.4s ease infinite;
}
.typing-indicator .dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator .dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-4px); }
}

/* ===== INPUT BAR ===== */
.input-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.input-bar textarea {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 12px 18px;
  color: var(--text);
  font-size: 1.05rem;
  line-height: 1.4;
  outline: none;
  font-family: inherit;
  resize: none;
  max-height: 140px;
  overflow-y: auto;
}
.input-bar textarea::placeholder { color: var(--text2); }
.input-bar textarea:focus { border-color: var(--accent); }
.input-bar .send-btn {
  width: 56px; height: 56px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: white;
  font-size: 1.4rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}
.input-bar .send-btn:active { transform: scale(0.9); }
.input-bar .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ===== WELCOME SCREEN ===== */
.welcome {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
}
.welcome .icon {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #a78bfa);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  margin-bottom: 12px;
}
.welcome h2 { font-size: 1.1rem; margin-bottom: 6px; }
.welcome p { color: var(--text2); font-size: 0.8rem; max-width: 280px; line-height: 1.5; }
.welcome .connecting { margin-top: 16px; color: var(--accent); font-size: 0.78rem; }
.spinner {
  width: 20px; height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== DATE SEPARATOR ===== */
.date-sep {
  align-self: center;
  font-size: 0.68rem;
  color: var(--text2);
  background: var(--surface);
  padding: 4px 12px;
  border-radius: 10px;
  margin: 8px 0;
}

/* ===== LOADING OLDER ===== */
.load-older {
  text-align: center;
  font-size: 0.7rem;
  color: var(--text2);
  padding: 8px;
  cursor: pointer;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== VOICE MODE ===== */
#voiceBtn.voice-active {
  color: var(--accent);
  animation: micPulse 1.4s ease infinite;
}
@keyframes micPulse {
  0%, 100% { text-shadow: 0 0 0 rgba(108, 92, 231, 0); }
  50% { text-shadow: 0 0 10px var(--accent-glow); }
}
</style>
</head>
<body>

<div class="chat-header">
  <div class="back-btn" onclick="showWelcome()">←</div>
  <div class="avatar">🤖</div>
  <div class="info">
    <div class="name">Claude</div>
    <div class="status" id="connectionStatus">
      <span class="dot offline"></span> Connecting...
    </div>
  </div>
  <a href="/platforms/status" title="Connected platforms"
     style="margin-left:auto;font-size:1.2rem;text-decoration:none;color:var(--text2);padding:14px;">🔌</a>
  <button id="voiceBtn" onclick="toggleVoiceMode()" title="Voice mode (hands-free)"
          style="background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--text2);padding:14px;">🎤</button>
  <button id="notifyBtn" onclick="enablePush()" title="Enable notifications"
          style="background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--text2);padding:14px;">🔕</button>
</div>

<div id="handoffBanner" class="handoff-banner"></div>

<!-- Welcome screen (shown while connecting) -->
<div id="welcomeScreen" class="welcome">
  <div class="icon">💬</div>
  <h2 id="welcomeName">Welcome!</h2>
  <p>Your Claude agent is connecting. Messages will appear here.</p>
  <div class="connecting">
    <div class="spinner"></div>
    Connecting to chat...
  </div>
</div>

<!-- Messages area -->
<div id="messagesContainer" class="messages" style="display:none;">
  <div id="loadOlder" class="load-older" onclick="loadOlder()">Load earlier messages</div>
  <div id="messagesList"></div>
  <div class="typing-indicator" id="typingIndicator">
    <span id="typingName">Claude</span> is typing
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
</div>

<!-- Input bar -->
<div class="input-bar">
  <textarea id="messageInput" placeholder="Type a message..." autocomplete="off" rows="1"
         onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); sendMessage(); }"
         oninput="onTyping(); autoGrow(this)"></textarea>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
</div>

<script>
// ============================================================
// CHAT STATE
// ============================================================

const SESSION_ID = '{{SESSION_ID}}';
const CLIENT_NAME = '{{CLIENT_NAME}}';
let ws = null;
let reconnectTimer = null;
let typingTimeout = null;
let isLoadingOlder = false;
let allMessagesLoaded = false;

const WS_BASE = (location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host;
const API_BASE = '/api/chat';

// ============================================================
// INIT
// ============================================================

async function init() {
  document.getElementById('welcomeName').textContent = `Hey ${CLIENT_NAME}!`;
  connectWebSocket();
  await loadMessages();
  initPush();

  // Voice mode is opt-in via a tap (browsers require a user gesture for
  // the first mic-permission prompt) but persists across reloads/app-resume
  // once granted, so driving sessions survive the phone locking/backgrounding.
  if (voiceSupported() && localStorage.getItem('voiceMode') === '1') {
    voiceModeOn = true;
    updateVoiceBtn();
    startRecognition();
  }
}

// ============================================================
// PUSH NOTIFICATIONS (PWA)
// ============================================================

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

async function initPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    document.getElementById('notifyBtn').style.display = 'none';
    return;
  }
  try {
    await navigator.serviceWorker.register('/sw.js', { scope: '/' });
    const reg = await navigator.serviceWorker.ready;
    const existing = await reg.pushManager.getSubscription();
    setNotifyBtn(!!existing && Notification.permission === 'granted');
  } catch (e) {
    console.warn('service worker registration failed', e);
  }
}

function setNotifyBtn(on) {
  const btn = document.getElementById('notifyBtn');
  if (!btn) return;
  btn.textContent = on ? '🔔' : '🔕';
  btn.title = on ? 'Notifications on' : 'Enable notifications';
}

async function enablePush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    alert('This browser doesn\'t support push notifications.');
    return;
  }
  if (Notification.permission === 'denied') {
    alert('Notifications are blocked for this site in your browser settings.');
    return;
  }
  const permission = await Notification.requestPermission();
  if (permission !== 'granted') return;

  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      const keyResp = await fetch(`${API_BASE}/vapid-public-key`);
      if (!keyResp.ok) throw new Error('vapid key unavailable');
      const { publicKey } = await keyResp.json();
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey),
      });
    }
    const subJson = sub.toJSON();
    await fetch(`${API_BASE}/${SESSION_ID}/push-subscribe`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ endpoint: subJson.endpoint, keys: subJson.keys }),
    });
    setNotifyBtn(true);
  } catch (e) {
    console.error('push subscribe failed', e);
    alert('Could not enable notifications: ' + e.message);
  }
}

// ============================================================
// VOICE MODE (hands-free -- built for driving, not desktop use)
//
// One tap turns it on; a wake word was considered and rejected -- browsers
// only grant microphone access on a real user gesture, so there's no way to
// start listening without a tap regardless, and a persistent always-on
// listener would burn battery/data for the whole drive. The tap-once
// approach also matches how Garry already starts a drive: get in, tap,
// go hands-free from there.
// ============================================================

const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let voiceModeOn = false;
let recognitionActive = false;   // recognition.start() called and not yet ended
let suppressRecognition = false; // true while TTS is speaking -- mic must not hear it
let pendingConfirmId = null;     // id of the most recent unanswered confirmation, or null

// Android/Chrome's recognizer marks a chunk "final" on almost any short
// pause -- sometimes after a single word -- regardless of continuous mode.
// Sending on every final result produced exactly what Garry hit: a message
// per word. Fix: never send straight off isFinal. Accumulate everything
// (final chunks committed, interim chunk previewed) into voiceBuffer, and
// only actually send once VOICE_SILENCE_MS passes with no new speech at
// all -- that's what "he's stopped talking" actually looks like, not one
// isFinal flag. The timer resets on every result, so a sentence with
// several isFinal chunks and natural pauses between words still sends as
// one message.
let voiceBuffer = '';
let voiceSilenceTimer = null;
const VOICE_SILENCE_MS = 1600;

function voiceSupported() {
  return !!SpeechRecognitionImpl && 'speechSynthesis' in window;
}

function toggleVoiceMode() {
  if (!voiceSupported()) {
    alert("This browser doesn't support hands-free voice mode. Works in Chrome on Android.");
    return;
  }
  voiceModeOn = !voiceModeOn;
  localStorage.setItem('voiceMode', voiceModeOn ? '1' : '0');
  updateVoiceBtn();
  if (voiceModeOn) {
    startRecognition();
  } else {
    stopRecognition();
    speechSynthesis.cancel();
    clearTimeout(voiceSilenceTimer);
    voiceBuffer = '';
    document.getElementById('messageInput').value = '';
    showConnected(); // restore the normal "Online" status text
  }
}

function updateVoiceBtn() {
  const btn = document.getElementById('voiceBtn');
  if (!btn) return;
  btn.textContent = voiceModeOn ? '🎙️' : '🎤';
  btn.classList.toggle('voice-active', voiceModeOn && recognitionActive);
  btn.title = voiceModeOn ? 'Voice mode on -- tap to stop' : 'Voice mode (hands-free)';
}

function setVoiceStatus(text) {
  if (!voiceModeOn) return;
  document.getElementById('connectionStatus').innerHTML = `<span class="dot"></span> ${text}`;
}

function startRecognition() {
  if (!voiceModeOn || suppressRecognition || recognitionActive) return;
  recognition = new SpeechRecognitionImpl();
  recognition.lang = 'en-AU';
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onstart = () => {
    recognitionActive = true;
    updateVoiceBtn();
    setVoiceStatus('Listening...');
  };

  recognition.onresult = (event) => {
    // event.resultIndex is where *new* results start this event -- results
    // before it were already processed (and, if final, already folded into
    // voiceBuffer) in a previous event.
    let interimText = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const res = event.results[i];
      if (res.isFinal) {
        voiceBuffer = (voiceBuffer ? voiceBuffer + ' ' : '') + res[0].transcript.trim();
      } else {
        interimText += res[0].transcript;
      }
    }
    // Live preview (committed buffer + whatever's still being recognized)
    // so it's visible the mic is actually hearing him -- doesn't send.
    document.getElementById('messageInput').value = (voiceBuffer + ' ' + interimText).trim();
    resetVoiceSilenceTimer();
  };

  recognition.onerror = (e) => {
    // 'no-speech' fires constantly on mobile after a few seconds of silence
    // during a drive -- expected, not a real error; onend below restarts it.
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      voiceModeOn = false;
      localStorage.setItem('voiceMode', '0');
      updateVoiceBtn();
      alert('Microphone access is blocked for this site -- enable it in your browser settings to use voice mode.');
    } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
      console.warn('speech recognition error:', e.error);
    }
  };

  recognition.onend = () => {
    recognitionActive = false;
    updateVoiceBtn();
    // Android caps how long one session runs -- often just a few seconds,
    // sometimes mid-sentence -- regardless of continuous:true. Restarting
    // does NOT touch voiceBuffer, so words spoken right up to the cutoff
    // are preserved and the next session's words get appended to them
    // rather than starting a new, separate utterance.
    if (voiceModeOn && !suppressRecognition) {
      setTimeout(startRecognition, 300);
    }
  };

  try {
    recognition.start();
  } catch (e) {
    console.warn('recognition.start() failed:', e);
    setTimeout(() => { if (voiceModeOn) startRecognition(); }, 500);
  }
}

function stopRecognition() {
  recognitionActive = false;
  if (recognition) {
    try { recognition.onend = null; recognition.stop(); } catch(e) {}
  }
  updateVoiceBtn();
}

// Stops listening, runs fn(resume), and only resumes listening once fn calls
// resume() -- used around speaking a reply, so the mic never picks up the
// phone's own TTS output as a new utterance.
function pauseRecognitionFor(fn) {
  suppressRecognition = true;
  if (recognition) { try { recognition.onend = null; recognition.stop(); } catch(e) {} }
  recognitionActive = false;
  updateVoiceBtn();
  fn(() => {
    suppressRecognition = false;
    if (voiceModeOn) startRecognition();
  });
}

function resetVoiceSilenceTimer() {
  clearTimeout(voiceSilenceTimer);
  voiceSilenceTimer = setTimeout(commitVoiceBuffer, VOICE_SILENCE_MS);
}

// Fires once real silence has passed -- this is the only place a voice
// utterance actually gets sent.
function commitVoiceBuffer() {
  const transcript = voiceBuffer.trim();
  voiceBuffer = '';
  document.getElementById('messageInput').value = '';
  if (transcript) handleVoiceUtterance(transcript);
}

const YES_WORDS = ['yes', 'yeah', 'yep', 'yup', 'correct', 'confirm', 'affirmative'];
const NO_WORDS = ['no', 'nope', 'nah', 'negative', 'cancel'];

function handleVoiceUtterance(transcript) {
  const normalized = transcript.toLowerCase().replace(/[.!?]+$/, '').trim();
  const firstWord = normalized.split(/\s+/)[0];
  // A pending confirmation (Yes/No prompt) takes voice priority over normal
  // send -- this is what makes approvals actually usable while driving,
  // the whole point of the "chat should mirror what's happening" ask.
  if (pendingConfirmId && document.getElementById(pendingConfirmId)) {
    if (YES_WORDS.includes(normalized) || YES_WORDS.includes(firstWord)) { answerConfirm(pendingConfirmId, true); return; }
    if (NO_WORDS.includes(normalized) || NO_WORDS.includes(firstWord)) { answerConfirm(pendingConfirmId, false); return; }
  }
  // No mic pause needed here -- sending doesn't touch the speaker, so
  // recognition can keep listening straight through into the next thing
  // said, which is what makes this feel like a conversation rather than
  // stop-start turns.
  sendText(transcript);
}

function speakReply(text) {
  if (!voiceModeOn || !('speechSynthesis' in window)) return;
  const plain = text
    .replace(/```[\s\S]*?```/g, ' code block, see chat. ')
    .replace(/[`*_#>]/g, '')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
    .trim();
  if (!plain) return;

  pauseRecognitionFor((resume) => {
    const utter = new SpeechSynthesisUtterance(plain);
    utter.lang = 'en-AU';
    utter.rate = 1.0;
    utter.onend = resume;
    utter.onerror = resume;
    setVoiceStatus('Speaking...');
    speechSynthesis.cancel(); // don't queue on top of a previous reply
    speechSynthesis.speak(utter);
  });
}

// ============================================================
// WEBSOCKET
// ============================================================

function connectWebSocket() {
  if (ws) try { ws.close(); } catch(e) {}
  
  const url = `${WS_BASE}/api/chat/ws/${SESSION_ID}`;
  ws = new WebSocket(url);

  ws.onopen = () => {
    showConnected();
  };

  ws.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      handleMessage(data);
    } catch(e) {
      console.error('WS parse error:', e);
    }
  };

  ws.onclose = () => {
    showDisconnected();
    reconnectTimer = setTimeout(connectWebSocket, 3000);
  };

  ws.onerror = (e) => {
    console.error('WS error:', e);
    ws.close();
  };
}

function showConnected() {
  const status = document.getElementById('connectionStatus');
  status.innerHTML = '<span class="dot"></span> Online';
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('messagesContainer').style.display = 'flex';
  scrollToBottom();
}

function showDisconnected() {
  const status = document.getElementById('connectionStatus');
  status.innerHTML = '<span class="dot offline"></span> Reconnecting...';
}

// ============================================================
// MESSAGE HANDLING
// ============================================================

function handleMessage(data) {
  switch (data.type) {
    case 'message':
      addMessage(data, data.sender === 'agent');
      if (data.sender === 'agent') {
        pendingConfirmId = data.message_type === 'confirmation' ? `confirm-${confirmCounter}` : null;
        speakReply(data.content);
      }
      break;
    case 'typing':
      if (data.sender === 'agent') {
        const typing = document.getElementById('typingIndicator');
        if (data.is_typing) {
          document.getElementById('typingName').textContent = data.sender_name || 'CoSidekick';
          typing.style.display = 'flex';
          scrollToBottom();
        } else {
          typing.style.display = 'none';
        }
      }
      break;
    case 'agent_change':
      showHandoffBanner(data.old_agent, data.new_agent, data.reason);
      // Update header
      document.querySelector('.chat-header .info .name').textContent =
        displayAgentName(data.new_agent);
      break;
  }
}

let confirmCounter = 0;

// Raw agent_name values are internal identifiers (Linux account / bridge
// name), never meant for the UI -- map to the friendly name shown in the
// header. Falls back to a title-cased version of anything not listed here.
const AGENT_DISPLAY_NAMES = { root: 'Claude', cosidekick: 'Claude', q: 'Q' };
function displayAgentName(name) {
  if (!name) return '';
  const key = name.toLowerCase();
  if (AGENT_DISPLAY_NAMES[key]) return AGENT_DISPLAY_NAMES[key];
  return key.charAt(0).toUpperCase() + key.slice(1);
}

// Lightweight, dependency-free markdown for chat bubbles: bold, inline code,
// and bullet/numbered lists -- the patterns replies actually use. Operates
// on already-HTML-escaped text, so the only tags it can introduce are the
// ones it inserts itself; no user/agent content can inject markup.
function renderMarkdownLite(escapedText) {
  const withInline = escapedText
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+?)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  const lines = withInline.split('\n');
  const pieces = [];
  let listType = null, listHtml = '';
  const flushList = () => {
    if (listType) { pieces.push({ list: true, html: `<${listType}>${listHtml}</${listType}>` }); listType = null; listHtml = ''; }
  };
  for (const raw of lines) {
    const bullet = raw.match(/^\s*[-*]\s+(.*)/);
    const numbered = raw.match(/^\s*\d+\.\s+(.*)/);
    const item = bullet || numbered;
    if (item) {
      const type = bullet ? 'ul' : 'ol';
      if (listType !== type) flushList();
      listType = type;
      listHtml += `<li>${item[1]}</li>`;
    } else {
      flushList();
      pieces.push({ list: false, text: raw });
    }
  }
  flushList();

  return pieces.map((p, i) => {
    if (p.list) return p.html;
    return (i > 0 && !pieces[i - 1].list ? '<br>' : '') + p.text;
  }).join('');
}

function addMessage(msg, isIncoming, prepend = false) {
  const list = document.getElementById('messagesList');
  const div = document.createElement('div');

  if (msg.message_type === 'system') {
    div.className = 'message system';
    div.textContent = msg.content;
  } else if (msg.message_type === 'confirmation' && msg.sender !== 'client') {
    const confirmId = `confirm-${++confirmCounter}`;
    div.className = 'message incoming confirmation';
    div.dataset.sender = msg.sender_name || '';
    div.innerHTML = `${renderMarkdownLite(escapeHtml(msg.content))}<div class="time">${formatTime(msg.created_at)}</div>` +
      `<div class="confirm-actions" id="${confirmId}">` +
      `<button class="confirm-btn yes" onclick="answerConfirm('${confirmId}', true)">Yes</button>` +
      `<button class="confirm-btn no" onclick="answerConfirm('${confirmId}', false)">No</button>` +
      `</div>`;
  } else if (msg.sender === 'client') {
    div.className = 'message outgoing';
    div.innerHTML = `${escapeHtml(msg.content)}<div class="time">${formatTime(msg.created_at)}</div>`;
  } else {
    div.className = 'message incoming';
    div.dataset.sender = msg.sender_name || '';
    // Only label the message when the agent differs from whichever incoming
    // message sits next to it in the DOM -- avoids repeating "Claude" on
    // every single bubble in a 1:1 conversation, same convention as
    // WhatsApp/iMessage. Read from the DOM (not a running variable) so it
    // stays correct regardless of append vs. prepend (loadOlder) order.
    const neighbor = prepend ? list.firstElementChild : list.lastElementChild;
    const neighborSender = neighbor && neighbor.classList.contains('incoming') ? neighbor.dataset.sender : undefined;
    const showLabel = msg.sender_name && msg.sender_name !== neighborSender;
    div.innerHTML = (showLabel ? `<div class="sender-label">${escapeHtml(displayAgentName(msg.sender_name))}</div>` : '') +
      `${renderMarkdownLite(escapeHtml(msg.content))}<div class="time">${formatTime(msg.created_at)}</div>`;
  }

  if (prepend) {
    list.prepend(div);
  } else {
    list.appendChild(div);
    scrollToBottom();
  }
}

function answerConfirm(confirmId, isYes) {
  const actions = document.getElementById(confirmId);
  if (!actions) return;
  if (pendingConfirmId === confirmId) pendingConfirmId = null;
  actions.querySelectorAll('button').forEach(b => b.disabled = true);
  actions.outerHTML = `<div class="confirm-answered">You replied: ${isYes ? 'Yes' : 'No'}</div>`;
  sendText(isYes ? 'Yes' : 'No');
}

function showHandoffBanner(oldAgent, newAgent, reason) {
  const banner = document.getElementById('handoffBanner');
  banner.style.display = 'block';
  banner.innerHTML = reason
    ? `Handed over from <span class="from">${oldAgent || 'previous agent'}</span> to <span class="to">${newAgent}</span> — ${escapeHtml(reason)}`
    : `Handed over from <span class="from">${oldAgent || 'previous agent'}</span> to <span class="to">${newAgent}</span>`;
  setTimeout(() => { banner.style.display = 'none'; }, 4000);
}

// ============================================================
// SEND MESSAGE
// ============================================================

function sendMessage() {
  const input = document.getElementById('messageInput');
  const content = input.value.trim();
  if (!content) return;
  input.value = '';
  autoGrow(input);
  sendText(content);
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

function sendText(content) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'message', content }));
  } else {
    // Fallback: HTTP
    fetch(`${API_BASE}/${SESSION_ID}/message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content, sender: 'client', sender_name: CLIENT_NAME, platform: 'webchat' })
    }).catch(e => console.error('HTTP fallback error:', e));
  }
}

function onTyping() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'typing', is_typing: true }));
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'typing', is_typing: false }));
      }
    }, 2000);
  }
}

// ============================================================
// LOAD MESSAGES
// ============================================================

async function loadMessages() {
  try {
    const res = await fetch(`${API_BASE}/${SESSION_ID}/messages?limit=50`);
    const data = await res.json();
    
    for (const msg of data.messages) {
      addMessage(msg, msg.sender !== 'client');
    }
    
    if (data.count < 50) {
      document.getElementById('loadOlder').style.display = 'none';
      allMessagesLoaded = true;
    }
    
    scrollToBottom();
  } catch(e) {
    console.error('Load error:', e);
  }
}

async function loadOlder() {
  if (isLoadingOlder || allMessagesLoaded) return;
  isLoadingOlder = true;
  
  const list = document.getElementById('messagesList');
  const currentCount = list.children.length;
  
  try {
    const res = await fetch(`${API_BASE}/${SESSION_ID}/messages?limit=50&offset=${currentCount}`);
    const data = await res.json();
    
    if (data.count < 50) {
      allMessagesLoaded = true;
      document.getElementById('loadOlder').style.display = 'none';
    }
    
    // Prepend in reverse order
    for (const msg of data.messages.reverse()) {
      addMessage(msg, msg.sender !== 'client', true);
    }
  } catch(e) {
    console.error('Load older error:', e);
  }
  
  isLoadingOlder = false;
}

// ============================================================
// UTILITIES
// ============================================================

function scrollToBottom() {
  setTimeout(() => {
    const container = document.getElementById('messagesContainer');
    container.scrollTop = container.scrollHeight;
  }, 50);
}

function formatTime(timestamp) {
  if (!timestamp) return '';
  const d = new Date(timestamp + 'Z');
  if (isNaN(d.getTime())) return '';
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function showWelcome() {
  // For mobile back button — could go to LeLinc dashboard
  window.history.back();
}

// ============================================================
// START
// ============================================================

document.addEventListener('DOMContentLoaded', init);

// PWA resume (app-switcher back to an already-running instance) doesn't
// re-fire DOMContentLoaded, so init()'s scroll-to-bottom never reruns on its
// own -- without this, reopening the app leaves you wherever the scroll
// position happened to be left last time.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    scrollToBottom();
    if (voiceModeOn && !recognitionActive && !suppressRecognition) startRecognition();
  }
});
window.addEventListener('pageshow', () => scrollToBottom());
</script>
